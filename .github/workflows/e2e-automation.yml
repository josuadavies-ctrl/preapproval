name: E2E Preapproval Sequence Runner

on:
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run Playwright tests headlessly (Recommended for Cloud)?'
        required: true
        type: boolean
        default: true

jobs:
  execute-pipeline:
    name: Run Sequence Pipeline
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install and Connect to Corporate VPN
        env:
          VPN_CONFIG_DATA: ${{ secrets.VPN_CONFIG }}
          VPN_AUTH_DATA: ${{ secrets.VPN_CREDENTIALS }}
        run: |
          # 1. Install OpenVPN cleanly via Chocolatey
          choco install openvpn -y
          
          # 2. Extract and save secrets to disk dynamically
          $VpnDir = "C:\VpnConfig"
          if (!(Test-Path $VpnDir)) { New-Item -ItemType Directory -Path $VpnDir | Out-Null }
          
          # Ensure routing does not hijack the GitHub Agent connection
          # We explicitly append route-nopull to prevent global gateway overrides
          $ConfigPath = "$VpnDir\client.ovpn"
          $VpnConfigData + "`nroute-nopull`n" | Out-File -FilePath $ConfigPath -Encoding ascii -Force
          $VpnAuthData | Out-File -FilePath "$VpnDir\credentials.txt" -Encoding ascii -Force
          
          Write-Host "🚀 Initializing OpenVPN Interface Daemon..." -ForegroundColor Cyan
          
          # 3. Start OpenVPN explicitly tracking an isolated log file
          $LogPath = "$VpnDir\openvpn.log"
          Start-Process "C:\Program Files\OpenVPN\bin\openvpn.exe" -ArgumentList "--config `"$ConfigPath`" --auth-user-pass `"$VpnDir\credentials.txt`" --log `"$LogPath`"" -NoNewWindow
          
          # 4. Active Handshake Verification Loop (Max 45 seconds)
          $Connected = $false
          for ($i = 1; $i -le 15; $i++) {
              Start-Sleep -Seconds 3
              if (Test-Path $LogPath) {
                  $Logs = Get-Content $LogPath
                  if ($Logs -match "Initialization Sequence Completed") {
                      Write-Host "✅ VPN Tunnel Successfully Established!" -ForegroundColor Green
                      $Connected = $true
                      break
                  }
              }
              Write-Host "⏳ Waiting for tunnel handshake... (Attempt $i/15)" -ForegroundColor Yellow
          }
          
          if (!$Connected) {
              Write-Error "❌ VPN CONNECTION FAILED: Handshake sequence timed out or aborted."
              if (Test-Path $LogPath) { Get-Content $LogPath | Select-Object -Last 20 }
              Exit 1
          }
          
          # 5. Inject a strict corporate network route definition
          # Replace 10.0.0.0/8 with the actual internal private subnet range of rc-opsadminui.saldev.net
          Write-Host "📡 Binding internal staging routes to the VPN interface..." -ForegroundColor Cyan
          route add 10.0.0.0 mask 255.0.0.0 0.0.0.0 metric 1
          
          # 6. Network Gateway Smoke Test
          Write-Host "📡 Verifying route visibility to Ops Admin Portal..." -ForegroundColor Cyan
          try {
              $Response = Invoke-WebRequest -Uri "https://rc-opsadminui.saldev.net/login" -TimeoutSec 10 -Method Head -ErrorAction Stop
              Write-Host "✅ Network Access Confirmed! Status Code: $($Response.StatusCode)" -ForegroundColor Green
          } catch {
              Write-Error "❌ FIREWALL BLOCK: Connected to VPN, but destination UI remains unreachable. Reason: $($_.Exception.Message)"
              Exit 1
          }
        shell: pwsh

      - name: Configure Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman Globally
        run: npm install -g newman

      - name: Configure .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore

      - name: Compile Test Projects
        run: dotnet build --no-restore --configuration Debug

      - name: Install Playwright Browsers
        run: |
          dotnet tool install --global Microsoft.Playwright.CLI || echo "Already installed"
          playwright install --with-deps

      - name: Run Sequence Runner
        run: .\SequenceRunner.ps1
        shell: pwsh

      - name: Archive Test Ledger & Artifact Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Preapproval-Run-Results
          path: |
            Salary_Finance_(Preapproval)/Data/Master_Ledger/
            Salary_Finance_(Preapproval)/Data/Test_Data_Output/
            Salary_Finance_(Preapproval)/Data/Journey_Report/
            Salary_Finance_(Preapproval)/bin/Debug/net10.0/*.png
          if-no-files-found: warn

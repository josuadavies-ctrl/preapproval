name: E2E Preapproval Sequence Runner

on:
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run Playwright tests headlessly (Recommended for Cloud)?'
        required: true
        type: boolean
        default: true

jobs:
  execute-pipeline:
    name: Run Sequence Pipeline
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install and Connect to Corporate VPN
        env:
          VPN_CONFIG_DATA: ${{ secrets.VPN_CONFIG }}
          VPN_AUTH_DATA: ${{ secrets.VPN_CREDENTIALS }}
        run: |
          # 1. Install OpenVPN cleanly via Chocolatey
          choco install openvpn -y
          
          # 2. Extract and save secrets to disk dynamically
          $VpnDir = "C:\VpnConfig"
          if (!(Test-Path $VpnDir)) { New-Item -ItemType Directory -Path $VpnDir | Out-Null }
          
          $ConfigPath = Join-Path $VpnDir 'client.ovpn'
          $CredPath   = Join-Path $VpnDir 'credentials.txt'
          $LogPath    = Join-Path $VpnDir 'openvpn.log'

          # 3. Read secrets from environment (PowerShell uses $env:...)
          $vpnConfig = $env:VPN_CONFIG_DATA
          $vpnAuth   = $env:VPN_AUTH_DATA

          if (-not $vpnConfig) {
              Write-Error "❌ VPN_CONFIG_DATA is empty or not provided."
              Exit 1
          }
          if (-not $vpnAuth) {
              Write-Error "❌ VPN_AUTH_DATA is empty or not provided."
              Exit 1
          }

          # Ensure routing does not hijack the GitHub Agent connection
          # We explicitly append route-nopull to prevent global gateway overrides
          $vpnConfig + "`nroute-nopull`n" | Out-File -FilePath $ConfigPath -Encoding ascii -Force
          $vpnAuth | Out-File -FilePath $CredPath -Encoding ascii -Force

          Write-Host "🚀 Starting OpenVPN (logging to $LogPath)..." -ForegroundColor Cyan

          # 4. Start OpenVPN explicitly tracking an isolated log file (Forcing Wintun driver)
          $argList = "--config `"$ConfigPath`" --auth-user-pass `"$CredPath`" --log `"$LogPath`" --windows-driver wintun"
          $proc = Start-Process -FilePath "C:\Program Files\OpenVPN\bin\openvpn.exe" -ArgumentList $argList -NoNewWindow -WindowStyle Hidden -PassThru

          # 5. Active Handshake Verification Loop (extend timeout to ~90s)
          $Connected = $false
          for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 3
              if (Test-Path $LogPath) {
                  try {
                      $Logs = Get-Content $LogPath -Raw -ErrorAction Stop
                  } catch {
                      $Logs = ""
                  }
                  if ($Logs -match "Initialization Sequence Completed") {
                      Write-Host "✅ VPN Tunnel Successfully Established!" -ForegroundColor Green
                      $Connected = $true
                      break
                  }
              }
              Write-Host "⏳ Waiting for tunnel handshake... (Attempt $i/30)" -ForegroundColor Yellow
          }

          if (-not $Connected) {
              Write-Error "❌ VPN CONNECTION FAILED: Handshake timed out or aborted. Last 60 lines of $LogPath:"
              if (Test-Path $LogPath) { Get-Content $LogPath | Select-Object -Last 60 }
              if ($proc) { Write-Host "OpenVPN process status: Id=$($proc.Id) HasExited=$($proc.HasExited)" }
              Exit 1
          }

          # 6. Inject a strict corporate network route definition (optional — ensure gateway/interface correct for your environment)
          Write-Host "📡 Binding internal staging routes to the VPN interface..." -ForegroundColor Cyan
          # NOTE: Replace <VPN_GATEWAY_IP> and/or IF <ifIndex> with correct values for your environment if you need to add a manual route.
          # route add 10.0.0.0 mask 255.0.0.0 <VPN_GATEWAY_IP> metric 1
          
          # 7. Network Gateway Smoke Test
          Write-Host "📡 Verifying route visibility to Ops Admin Portal..." -ForegroundColor Cyan
          try {
              $Response = Invoke-WebRequest -Uri "https://rc-opsadminui.saldev.net/login" -TimeoutSec 10 -Method Head -ErrorAction Stop
              Write-Host "✅ Network Access Confirmed! Status Code: $($Response.StatusCode)" -ForegroundColor Green
          } catch {
              Write-Error "❌ FIREWALL BLOCK: Connected to VPN, but destination UI remains unreachable. Reason: $($_.Exception.Message)"
              Exit 1
          }
        shell: pwsh

      - name: Configure Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman Globally
        run: npm install -g newman

      - name: Configure .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore

      - name: Compile Test Projects
        run: dotnet build --no-restore --configuration Debug

      - name: Install Playwright Browsers
        run: |
          dotnet tool install --global Microsoft.Playwright.CLI || echo "Already installed"
          playwright install --with-deps

      - name: Run Sequence Runner
        run: .\SequenceRunner.ps1
        shell: pwsh

      - name: Archive Test Ledger & Artifact Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Preapproval-Run-Results
          path: |
            Salary_Finance_(Preapproval)/Data/Master_Ledger/
            Salary_Finance_(Preapproval)/Data/Test_Data_Output/
            Salary_Finance_(Preapproval)/Data/Journey_Report/
            Salary_Finance_(Preapproval)/bin/Debug/net10.0/*.png
          if-no-files-found: warn
